name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Validar composer.json
        run: composer validate --strict

      - name: Instalar dependências
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Contar testes (defesa contra suíte vazia)
        run: |
          COUNT=$(vendor/bin/phpunit --list-tests | grep -c ' - ')
          echo "Testes detectados: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "Nenhum teste encontrado. Build reprovada."
            exit 1
          fi

      - name: Executar suíte PHPUnit
        run: vendor/bin/phpunit --fail-on-empty-test-suite --fail-on-warning
